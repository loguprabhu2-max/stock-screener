{% extends "base.html" %}
{% block title %}Sign in - Stock Screener{% endblock %}
{% block body_class %}no-chrome{% endblock %}
{% block content_no_sidebar %}
<div class="login-wrapper">
    <!-- Decorative floating chip icons -->
    <div class="float-chip float-chip-1"><i data-lucide="bar-chart-3"></i></div>
    <div class="float-chip float-chip-2"><i data-lucide="trending-up"></i></div>
    <div class="float-chip float-chip-3"><i data-lucide="pie-chart"></i></div>
    <div class="float-chip float-chip-4"><i data-lucide="circle-dollar-sign"></i></div>

    <div class="login-card">
        <div class="login-brand">
            <div class="brand-mark large"><i data-lucide="line-chart"></i></div>
            <h1>Stock Screener</h1>
            <p class="subtitle">Sign in to continue</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <div class="input-with-icon">
                <i data-lucide="user"></i>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <label for="password">Password</label>
            <div class="input-with-icon">
                <i data-lucide="lock"></i>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Show password">
                    <i data-lucide="eye" id="pwEye"></i>
                </button>
            </div>

            <button type="submit" class="btn-primary btn-full btn-gradient">
                <i data-lucide="log-in"></i> Sign In
            </button>

            <div class="divider"><span>or</span></div>

            <a href="mailto:" class="btn-secondary btn-full">
                <i data-lucide="shield"></i> Contact Administrator
            </a>
        </form>
    </div>

    <p class="login-footer">
        <i data-lucide="shield-check"></i>
        Secure access to your stock screening platform
    </p>
</div>

<script>
function togglePw() {
    var inp = document.getElementById('password');
    var icon = document.getElementById('pwEye');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
    } else {
        inp.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
    }
    if (window.lucide) lucide.createIcons();
}
</script>
{% endblock %}
